name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway credentials for the CI-only service container.
          POSTGRES_USER: mimi
          POSTGRES_PASSWORD: mimi
          POSTGRES_DB: mimi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mimi -d mimi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Enables the PostgreSQL integration tests; fixtures apply migrations.
      MIMI_TEST_DATABASE_URL: postgresql+psycopg://mimi:mimi@localhost:5432/mimi_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: pip install -e ".[dev]"

      - name: Ruff format
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: mypy
        run: mypy

      - name: pytest (unit + PostgreSQL integration, with coverage)
        run: pytest -rs --cov --cov-report=term-missing
