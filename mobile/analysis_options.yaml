include: package:flutter_lints/flutter.yaml

analyzer:
  # Stricter typing: no implicit dynamic casts or inferred raw generics.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    # Generated by build_runner; never edited by hand.
    - "**/*.g.dart"
    - "**/*.gr.dart"
    - "**/*.freezed.dart"
